name: CI - Quality, Build and Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci-pipeline:
    name: Lint, Build and Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: assettracker
          POSTGRES_PASSWORD: assettracker
          POSTGRES_DB: assettracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3334
      DATABASE_URL: postgresql://assettracker:assettracker@localhost:5432/assettracker_test?schema=public
      FRONTEND_URL: http://localhost:3000
      JWT_ACCESS_SECRET: assettracker_ci_access_secret_with_at_least_32_characters
      JWT_REFRESH_SECRET: assettracker_ci_refresh_secret_with_at_least_32_characters
      USE_EXTERNAL_MARKET_API: 'false'
      MARKET_API_BASE_URL: https://query1.finance.yahoo.com/v7/finance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Setup Prisma and database migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run automated tests with coverage
        run: npm run test:ci

      - name: Build application
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
