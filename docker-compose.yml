services:
  app:
    build:
      context: .
    container_name: assettracker-api
    ports:
      - '3333:3333'
    environment:
      PORT: 3333
      NODE_ENV: development
      DATABASE_URL: postgresql://assettracker:assettracker@postgres:5432/assettracker_db?schema=public
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: assettracker-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: assettracker
      POSTGRES_PASSWORD: assettracker
      POSTGRES_DB: assettracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    container_name: assettracker-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
