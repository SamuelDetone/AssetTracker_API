services:
  app:
    build:
      context: .
    container_name: assettracker-api
    ports:
      - '${PORT:-3333}:3333'
    environment:
      PORT: ${PORT:-3333}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: assettracker-postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    container_name: assettracker-adminer
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
